# Configuração mestre — perfis: local (dev) | prod (Railway/Vercel)
spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: vehicle-sales-manager-v2
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
  servlet:
    multipart:
      # Ajuste para upload de imagens (S3). Em produção, prefira setar via ENV no Railway.
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:10MB}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:mySecretKey12345678901234567890123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}
