# Perfil prod — Railway/Vercel; variáveis de ambiente obrigatórias
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:10MB}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

# Em produção exigimos JWT_SECRET e CORS_ALLOWED_ORIGINS definidos via ENV.
# Sem fallback: se ausentes, a aplicação falha no startup (fail-fast).
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  forward-headers-strategy: FRAMEWORK
